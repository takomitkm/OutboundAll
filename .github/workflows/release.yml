name: release

# CD: tag push (v*) auto-publishes the role-split packages as a GitHub Release.
# ci.yml remains the PR/push gate; this workflow re-runs the same packaging
# script so release artifacts are byte-identical to CI-built ones.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  publish:
    name: build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: package
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh "${GITHUB_REF_NAME}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=()
          prev_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            notes_args+=(--notes-start-tag "$prev_tag")
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists -- replacing assets"
            gh release upload "$GITHUB_REF_NAME" dist/packages/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/packages/* \
              --title "dialhome $GITHUB_REF_NAME" \
              --generate-notes "${notes_args[@]}"
          fi
          gh release view "$GITHUB_REF_NAME"
