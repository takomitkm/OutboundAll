name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local  # fail loudly instead of silently downloading a toolchain; go.mod pins 1.27

jobs:
  test:
    name: vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Windows runner images default to core.autocrlf=true: checkout rewrites every
      # Go file to CRLF and gofmt -l then flags all of them (all 9 CI runs since the
      # workflow was added failed on exactly this). Normalize before checkout.
      - name: normalize git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: gofmt check
        shell: bash
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  build-matrix:
    name: build matrix + checksums
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: build all targets
        run: |
          chmod +x scripts/build-matrix.sh
          ./scripts/build-matrix.sh "${{ github.ref_name }}-${{ github.sha }}"
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialhome-dist
          path: dist/
          retention-days: 14

  smoke-linux:
    name: smoke (linux install/run/doctor)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: build
        run: go build -o /tmp/dialhome ./cmd/dialhome
      - name: doctor (read-only, no node installed)
        run: /tmp/dialhome doctor
      - name: version + usage exit codes
        run: |
          /tmp/dialhome version
          set +e
          /tmp/dialhome migrate >/dev/null 2>&1; echo "usage exit=$?"
          /tmp/dialhome nosuchcmd >/dev/null 2>&1; echo "unknown exit=$?"
          test "$(/tmp/dialhome migrate >/dev/null 2>&1; echo $?)" = "2"
          test "$(/tmp/dialhome nosuchcmd >/dev/null 2>&1; echo $?)" = "2"
      - name: node install (temporary, fake credential rejected cleanly)
        run: |
          set +e
          echo '{}' > /tmp/cred.json
          /tmp/dialhome node install --mode temporary --credential /tmp/cred.json
          rc=$?
          echo "install-with-bad-cred exit=$rc"
          # must fail (not panic) with a nonzero exit; $? was consumed by the echo above,
          # so the old inline assertion always tested the echo (0) and never passed
          test "$rc" != "0"

  hs-e2e:
    name: hs e2e (gates G1-G5 first pass)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: normalize git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: download pinned deps (headscale 0.29.7 / sing-box 1.14.4 / tailscale 1.104.7)
        run: bash hs/scripts/e2e-deps.sh
      - name: run e2e chain
        run: |
          set -o pipefail
          source .e2e-deps/paths.env
          go test ./hs/internal/hstest -tags hs_integration -count=1 -timeout 14m -v 2>&1 | tee e2e.log
      - name: gate summary
        if: always()
        run: grep -aE "GATE|RESULT|FAIL|registration" e2e.log | tail -30 || true
      - name: upload e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-e2e-log
          path: e2e.log
          retention-days: 14

