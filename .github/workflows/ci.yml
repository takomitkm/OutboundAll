name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local  # fail loudly instead of silently downloading a toolchain; go.mod pins 1.27

jobs:
  test:
    name: vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: gofmt check
        shell: bash
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  build-matrix:
    name: build matrix + checksums
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: build all targets
        run: |
          chmod +x scripts/build-matrix.sh
          ./scripts/build-matrix.sh "${{ github.ref_name }}-${{ github.sha }}"
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialhome-dist
          path: dist/
          retention-days: 14

  smoke-linux:
    name: smoke (linux install/run/doctor)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: build
        run: go build -o /tmp/dialhome ./cmd/dialhome
      - name: doctor (read-only, no node installed)
        run: /tmp/dialhome doctor
      - name: version + usage exit codes
        run: |
          /tmp/dialhome version
          set +e
          /tmp/dialhome migrate >/dev/null 2>&1; echo "usage exit=$?"
          /tmp/dialhome nosuchcmd >/dev/null 2>&1; echo "unknown exit=$?"
          test "$(/tmp/dialhome migrate >/dev/null 2>&1; echo $?)" = "2"
          test "$(/tmp/dialhome nosuchcmd >/dev/null 2>&1; echo $?)" = "2"
      - name: node install (temporary, fake credential rejected cleanly)
        run: |
          set +e
          echo '{}' > /tmp/cred.json
          /tmp/dialhome node install --mode temporary --credential /tmp/cred.json
          echo "install-with-bad-cred exit=$?"
          # must fail (not panic) with a nonzero exit
          test "$?" != "0"

